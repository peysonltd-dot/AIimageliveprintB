<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Portrait Download | 肖像下載 [機台 B]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+TC:wght@300;500;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/ocean-theme.css?v=12">
</head>
<body class="ocean-bg text-sky-950">

    <div class="min-h-[100dvh] w-full px-6 py-6 flex flex-col justify-between">
        <header class="text-center w-full flex-shrink-0 mb-4 flex flex-col items-center">
            <h1 id="header-title" class="text-2xl font-black tracking-widest text-sky-950  pt-2">
                肖像下載
            </h1>
            <span class="text-slate-600 text-xs font-mono tracking-wider block mt-1">
                Portrait Download [Booth B]
            </span>
            <div class="h-[2px] w-24 bg-gradient-to-r from-transparent via-[#00f2ff] to-transparent mx-auto mt-2"></div>
        </header>

        <main class="flex-grow flex flex-col items-center justify-center my-auto w-full max-w-sm mx-auto">
            <div class="glass-card rounded-[2.5rem] p-6 w-full text-center flex flex-col items-center relative overflow-hidden">
                <div class="mb-5">
                    <span class="text-[10px] font-mono tracking-widest text-ai-cyan block">PORTRAIT NO</span>
                    <span id="display-task-id" class="text-4xl font-black font-mono tracking-wider text-sky-950">#---</span>
                </div>

                <div class="relative w-full aspect-[4/3] mb-6 rounded-3xl overflow-hidden border-2 shimmer-pulse flex items-center justify-center bg-white/80">
                    <div id="loading-spinner" class="absolute flex flex-col items-center justify-center text-slate-400 gap-3">
                        <i class="fa-solid fa-spinner animate-spin text-3xl text-ai-cyan"></i>
                        <span id="spinner-text-zh" class="text-xs tracking-wider font-bold">正在為您沖印肖像...</span>
                    </div>
                    <img id="portrait-img" class="w-full h-full object-contain hidden" alt="AI Portrait" />
                </div>

                <div class="mb-4 text-center">
                    <p id="guide-text-1" class="text-ai-cyan font-black text-sm tracking-widest mb-0.5">
                        <i class="fa-solid fa-hand-pointer mr-1 animate-bounce"></i> 長按上方圖片即可儲存
                    </p>
                    <p id="guide-text-2" class="text-slate-600 font-mono text-xs mb-1">
                        Long-press Image to Save
                    </p>
                    <p class="text-[9px] text-slate-400">iOS (Safari/LINE/WeChat) & Android</p>
                </div>

                <button id="download-btn" disabled class="glow-button w-full py-4 rounded-2xl font-bold tracking-widest text-sm flex flex-col items-center justify-center gap-0.5 opacity-50 cursor-not-allowed">
                    <span id="btn-text-main"><i class="fa-solid fa-download mr-1.5"></i>一鍵下載檔案</span>
                    <span class="text-[10px] font-mono opacity-80">DOWNLOAD PORTRAIT</span>
                </button>

            </div>
        </main>



    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('taskId');
        const langParam = urlParams.get('lang');
        // 🔒 硬編碼固定連線至機台 B 後端
        const API_BASE_URL = "https://aicamera-backend-b.onrender.com";

        const isJapanese = langParam === 'jp' || navigator.language.startsWith('ja');

        if (isJapanese) {
            document.getElementById('header-title').innerText = "画像ダウンロード";
            document.getElementById('spinner-text-zh').innerText = "画像を処理中...";
            document.getElementById('guide-text-1').innerHTML = `<i class="fa-solid fa-hand-pointer mr-1 animate-bounce"></i> 上の画像を長押しして保存`;
            document.getElementById('btn-text-main').innerHTML = `<i class="fa-solid fa-download mr-1.5"></i> 画像を保存する`;
        }

        const displayIdEl = document.getElementById('display-task-id');
        const portraitImg = document.getElementById('portrait-img');
        const spinner = document.getElementById('loading-spinner');
        const downloadBtn = document.getElementById('download-btn');

        if (taskId) {
            displayIdEl.innerText = `#${taskId}`;
            fetchPortraitData();
        } else {
            displayIdEl.innerText = "#ERROR";
        }

        async function fetchPortraitData() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/status/${taskId}`);
                const data = await res.json();
                
                if (data.success && data.chosenDesign) {
                    const finalImage = data.chosenDesign === 'A' ? data.resultImageA : data.resultImageB;
                    
                    if (finalImage) {
                        portraitImg.src = finalImage;
                        portraitImg.classList.remove('hidden');
                        spinner.classList.add('hidden');
                        
                        downloadBtn.disabled = false;
                        downloadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                        
                        downloadBtn.addEventListener('click', async () => {
                            try {
                                const response = await fetch(finalImage);
                                const blob = await response.blob();
                                const blobUrl = window.URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.style.display = 'none';
                                a.href = blobUrl;
                                a.download = `Portrait_B_${taskId}.${blob.type === 'image/png' ? 'png' : 'jpg'}`;
                                document.body.appendChild(a);
                                a.click();
                                window.URL.revokeObjectURL(blobUrl);
                                document.body.removeChild(a);
                            } catch (e) {
                                window.open(finalImage, '_blank');
                            }
                        });
                    }
                } else {
                    document.getElementById('spinner-text-zh').textContent=isJapanese?'スタッフが確認中です':'合影確認中，請稍候';
                    setTimeout(fetchPortraitData,3000);
                }
            } catch (err) {
                setTimeout(fetchPortraitData, 3000);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機台 B | 後台智慧控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --ai-cyan: #00f2ff; --ai-pink: #ff00d0; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0b1329; background-image: radial-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 0); background-size: 24px 24px; }
        .cyber-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(0, 242, 255, 0.15); transition: all 0.3s ease; }
        .cyber-card:hover { border-color: var(--ai-cyan); box-shadow: 0 0 20px rgba(0, 242, 255, 0.15); }
        .glow-text { text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .cyber-select { background-color: #0f172a; border: 1px solid #334155; color: #f1f5f9; font-weight: bold; padding: 0.35rem 0.5rem; border-radius: 0.5rem; outline: none; }
        .upload-zone:focus { outline: none; border-color: var(--ai-cyan) !important; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); background: rgba(0, 242, 255, 0.05) !important; }
        .upload-zone.dragover { border-color: var(--ai-pink) !important; box-shadow: 0 0 15px rgba(255, 0, 208, 0.4); background: rgba(255, 0, 208, 0.05) !important; }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8">

    <input type="file" id="global-file-input-A" class="hidden" accept="image/*" />
    <input type="file" id="global-file-input-B" class="hidden" accept="image/*" />

    <header class="max-w-7xl mx-auto mb-8 flex flex-col sm:flex-row justify-between items-center border-b border-cyan-500/20 pb-4 gap-4">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
            <h1 class="text-2xl font-black tracking-wider text-white">機台 B 控制台 <span class="text-cyan-400 font-mono text-lg">[BOOTH_B]</span></h1>
        </div>
        
        <div class="flex flex-wrap items-center gap-3">
            <button onclick="fetchAllTasks()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow-[0_0_15px_rgba(0,242,255,0.3)]">
                <i class="fa-solid fa-arrows-rotate"></i> 重新整理數據
            </button>
            <button onclick="executeResetAll()" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 border border-rose-500/40">
                <i class="fa-solid fa-trash-can"></i> 重製機台 B 排隊
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <div id="tasks-container" class="grid grid-cols-1 gap-6 transition-all duration-500"></div>
    </main>

    <script>
        // 🔒 硬編碼固定連線至機台 B 後端
        const API_BASE_URL = "https://aicamera-backend-b.onrender.com";
        let localTasksCache = {};
        let currentUploadTaskId = null;

        function compressAndResizeImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    const max_size = 1024; 
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function executeResetAll() {
            if (!confirm("確定要重製機台 B 的所有排隊嗎？")) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/reset-all`, { method: 'POST' });
                if ((await res.json()).success) { localTasksCache = {}; renderTasks([]); }
            } catch (err) {}
        }

        async function updateTaskMeta(taskId, field, value) {
            const task = localTasksCache[taskId];
            if (task) {
                task[field] = value;
                fetch(`${API_BASE_URL}/api/admin/update-meta/${taskId}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ processStatus: task.processStatus, remark: task.remark })
                }).catch(e => {});
            }
        }

        function downloadSourceImage(taskId) {
            const task = localTasksCache[taskId]; if (!task || !task.sourceImage) return;
            const link = document.createElement('a'); link.href = task.sourceImage; link.download = `客照_B_#${taskId}.jpg`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function downloadResultImage(taskId, choice) {
            const task = localTasksCache[taskId]; if (!task) return;
            const base64Str = choice === 'A' ? task.resultImageA : task.resultImageB; if (!base64Str) return;
            const link = document.createElement('a'); link.href = base64Str; link.download = `AI結果_B_#${taskId}_風格${choice}.jpg`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function triggerDualUpload(taskId, targetType) {
            currentUploadTaskId = taskId; document.getElementById(`global-file-input-${targetType}`).click();
        }

        async function handleImageFileInject(file, taskId, type) {
            compressAndResizeImage(file, async (compressedBase64) => {
                const bodyData = {}; bodyData[`resultImage${type}`] = compressedBase64;
                try {
                    const res = await fetch(`${API_BASE_URL}/api/admin/upload-result-dual/${taskId}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyData)
                    });
                    if ((await res.json()).success) {
                        if (!localTasksCache[taskId]) localTasksCache[taskId] = {};
                        localTasksCache[taskId][`resultImage${type}`] = compressedBase64; fetchAllTasks();
                    }
                } catch (err) { fetchAllTasks(); }
            });
        }

        ['A', 'B'].forEach(type => {
            document.getElementById(`global-file-input-${type}`).addEventListener('change', function() {
                const taskId = currentUploadTaskId; if (!taskId || !this.files[0]) return;
                handleImageFileInject(this.files[0], taskId, type); this.value = "";
            });
        });

        async function fetchSourceImageIncrementally(taskId) {
            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/task-source-image/${taskId}`);
                const data = await res.json();
                if (data.success && data.sourceImage) {
                    localTasksCache[taskId].sourceImage = data.sourceImage;
                    renderTasks(Object.values(localTasksCache).sort((a, b) => b.id.localeCompare(a.id)));
                }
            } catch (e) {}
        }

        async function fetchResultImageIncrementally(taskId) {
            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/task-result-images/${taskId}`);
                const data = await res.json();
                if (data.success) {
                    if (data.resultImageA) localTasksCache[taskId].resultImageA = data.resultImageA;
                    if (data.resultImageB) localTasksCache[taskId].resultImageB = data.resultImageB;
                    renderTasks(Object.values(localTasksCache).sort((a, b) => b.id.localeCompare(a.id)));
                }
            } catch (e) {}
        }

        async function fetchAllTasks() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/all-tasks?lightweight=true`);
                const data = await res.json();
                if (data.success) {
                    data.tasks.forEach(t => { 
                        const isNewTask = !localTasksCache[t.id];
                        if (isNewTask) { t.processStatus = '製作中'; t.remark = ''; } 
                        else {
                            t.processStatus = localTasksCache[t.id].processStatus; t.remark = localTasksCache[t.id].remark;
                            if (localTasksCache[t.id].sourceImage) t.sourceImage = localTasksCache[t.id].sourceImage;
                            if (localTasksCache[t.id].resultImageA) t.resultImageA = localTasksCache[t.id].resultImageA;
                            if (localTasksCache[t.id].resultImageB) t.resultImageB = localTasksCache[t.id].resultImageB;
                        }
                        localTasksCache[t.id] = t; 
                        if (t.hasSourceImage && !localTasksCache[t.id].sourceImage) fetchSourceImageIncrementally(t.id);
                        if ((t.hasResultImageA || t.hasResultImageB) && (!localTasksCache[t.id].resultImageA || !localTasksCache[t.id].resultImageB)) fetchResultImageIncrementally(t.id);
                    });
                    renderTasks(Object.values(localTasksCache).sort((a, b) => b.id.localeCompare(a.id)));
                }
            } catch (e) {}
        }

        function renderTasks(tasks) {
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT')) return;
            const container = document.getElementById('tasks-container');
            if (tasks.length === 0) { container.innerHTML = `<div class="text-center py-12 text-slate-500 border border-dashed border-slate-800 rounded-2xl w-full">尚無排隊訂單</div>`; return; }

            container.innerHTML = tasks.map(task => {
                const currentStatus = task.processStatus || '製作中';
                const currentRemark = task.remark || '';
                const userChoiceHtml = task.chosenDesign 
                    ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded font-black text-xs"><i class="fa-solid fa-circle-check mr-1"></i> 已確認：[ 風格 ${task.chosenDesign} 款 ]</span>`
                    : `<span class="text-amber-400 font-bold animate-pulse text-xs"><i class="fa-solid fa-hourglass-start mr-1"></i> 客人二選一中...</span>`;

                const chosenImgSrc = task.chosenDesign === 'A' ? task.resultImageA : task.resultImageB;
                const finalResultHtml = task.chosenDesign ? (
                    chosenImgSrc ? `
                        <span class="text-[10px] font-bold text-emerald-400 mb-1 text-center w-full block font-sans"><i class="fa-solid fa-trophy mr-1 text-emerald-400"></i> 客人已選: ${task.chosenDesign} 款</span>
                        <img src="${chosenImgSrc}" class="w-24 h-24 object-cover rounded-xl border-2 border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.25)] mx-auto" />
                        <button onclick="downloadResultImage('${task.id}', '${task.chosenDesign}')" class="w-full mt-2 bg-emerald-900/60 hover:bg-emerald-800 text-emerald-400 font-bold py-1.5 px-2 rounded-lg text-[10px] transition-all flex items-center justify-center gap-1 border border-emerald-500/50"><i class="fa-solid fa-download"></i> 下載彩印圖</button>
                    ` : `<div class="w-24 h-24 rounded-xl border-2 border-dashed border-emerald-500 flex flex-col items-center justify-center text-emerald-400 mx-auto bg-emerald-950/20"><i class="fa-solid fa-circle-notch animate-spin text-xl mb-1 text-emerald-400"></i><span class="text-[9px] text-emerald-400">同步中...</span></div>`
                ) : `<span class="text-[10px] font-bold text-amber-400 animate-pulse text-center w-full block mb-1 font-sans"><i class="fa-solid fa-hourglass-half mr-1"></i> 等待選擇</span><div class="w-24 h-24 rounded-xl border-2 border-dashed border-slate-600 flex items-center justify-center text-slate-600 mx-auto"><i class="fa-solid fa-image text-2xl"></i></div>`;

                return `
                <div class="cyber-card p-4 md:p-5 rounded-2xl flex flex-col md:flex-row gap-6 items-stretch relative overflow-hidden">
                    <div class="flex flex-col items-center gap-2 w-full md:w-32 flex-shrink-0 md:border-r border-slate-700/50 md:pr-4">
                        <div class="text-center w-full">
                            <span class="text-[10px] font-mono tracking-widest text-cyan-400 block font-bold">QUEUE NO</span>
                            <span class="text-4xl font-black text-white font-mono glow-text">#${task.id}</span>
                            <div class="text-[9px] text-slate-500 font-mono mt-1">${task.createdAt || '--:--'}</div>
                        </div>
                        <div class="text-center relative w-full mt-1">
                            ${task.sourceImage ? `<img src="${task.sourceImage}" class="w-20 h-20 mx-auto object-cover rounded-xl border border-slate-700 bg-black shadow-inner" /><button onclick="downloadSourceImage('${task.id}')" class="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-1.5 px-2 rounded-lg text-[10px] transition-all flex items-center justify-center gap-1"><i class="fa-solid fa-download"></i> 下載原照</button>` : `<div class="w-20 h-20 rounded-xl border border-dashed border-slate-700 bg-black flex flex-col items-center justify-center text-slate-500 mx-auto"><i class="fa-solid fa-spinner animate-spin text-lg mb-1"></i><span class="text-[9px]">傳輸中...</span></div>`}
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 w-full md:w-40 flex-shrink-0 md:border-r border-slate-700/50 md:pr-4 justify-center">
                        <span class="text-[11px] font-bold text-slate-300 text-center mb-1"><i class="fa-solid fa-upload text-cyan-400 mr-1"></i> 上傳 AI 風格圖</span>
                        <div class="flex gap-3 justify-center">
                            <div class="text-center w-full"><span class="text-[9px] block text-slate-400 mb-1 font-bold">A 款</span><button onclick="triggerDualUpload('${task.id}', 'A')" class="upload-zone w-full h-14 rounded-lg border border-dashed ${task.resultImageA ? 'border-emerald-500 bg-emerald-950/20' : 'border-cyan-500/40 bg-slate-900'} flex items-center justify-center text-[11px] cursor-pointer">${task.resultImageA ? `<i class="fa-solid fa-check text-emerald-400 text-xl"></i>` : `<i class="fa-solid fa-plus text-cyan-400"></i>`}</button></div>
                            <div class="text-center w-full"><span class="text-[9px] block text-slate-400 mb-1 font-bold">B 款</span><button onclick="triggerDualUpload('${task.id}', 'B')" class="upload-zone w-full h-14 rounded-lg border border-dashed ${task.resultImageB ? 'border-emerald-500 bg-emerald-950/20' : 'border-cyan-500/40 bg-slate-900'} flex items-center justify-center text-[11px] cursor-pointer">${task.resultImageB ? `<i class="fa-solid fa-check text-emerald-400 text-xl"></i>` : `<i class="fa-solid fa-plus text-cyan-400"></i>`}</button></div>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1 w-full md:w-40 flex-shrink-0 md:border-r border-slate-700/50 md:pr-4 justify-center items-center">${finalResultHtml}</div>
                    <div class="flex-grow flex flex-col gap-3 min-w-[200px] justify-center">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1">任務進度狀態</label>
                            <select onchange="updateTaskMeta('${task.id}', 'processStatus', this.value)" class="cyber-select w-full bg-slate-900 border border-slate-700 text-sm text-slate-200">
                                <option value="製作中" ${currentStatus === '製作中' ? 'selected' : ''}>⏳ 製作中</option>
                                <option value="已完成" ${currentStatus === '已完成' ? 'selected' : ''}>✅ 已完成</option>
                                <option value="已取消" ${currentStatus === '已取消' ? 'selected' : ''}>❌ 已取消</option>
                            </select>
                        </div>
                        <div class="flex-grow flex flex-col">
                            <label class="text-[10px] font-bold text-slate-400 block mb-1">任務備註事項</label>
                            <textarea onchange="updateTaskMeta('${task.id}', 'remark', this.value)" placeholder="輸入備註..." class="cyber-textarea w-full flex-grow min-h-[60px] bg-slate-900 text-slate-200 p-2.5 rounded-lg border border-slate-700 text-xs resize-none">${currentRemark}</textarea>
                        </div>
                        <div class="mt-2 flex items-center justify-end border-t border-slate-800 pt-2.5 gap-2"><div class="text-xs text-right">${userChoiceHtml}</div></div>
                    </div>
                </div>`;
            }).join('');
        }

        fetchAllTasks();
        setInterval(fetchAllTasks, 3200);
    </script>
</body>
</html>

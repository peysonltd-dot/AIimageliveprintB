<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>機台 B | 後台智慧控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        [hidden] { display: none !important; }
        :root { --ai-cyan: #00f2ff; --ai-pink: #ff00d0; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0b1329; background-image: radial-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 0); background-size: 24px 24px; }
        .cyber-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(0, 242, 255, 0.15); transition: all 0.3s ease; }
        .cyber-card:hover { border-color: var(--ai-cyan); box-shadow: 0 0 20px rgba(0, 242, 255, 0.15); }
        .glow-text { text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .cyber-select { background-color: #0f172a; border: 1px solid #334155; color: #f1f5f9; font-weight: bold; padding: 0.35rem 0.5rem; border-radius: 0.5rem; outline: none; }
        .upload-zone:focus { outline: none; border-color: var(--ai-cyan) !important; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); background: rgba(0, 242, 255, 0.05) !important; }
        .upload-zone.dragover { border-color: var(--ai-pink) !important; box-shadow: 0 0 15px rgba(255, 0, 208, 0.4); background: rgba(255, 0, 208, 0.05) !important; }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8">

    <section id="login-panel" class="min-h-[85vh] flex items-center justify-center">
        <form id="login-form" class="cyber-card rounded-2xl p-8 w-full max-w-sm">
            <h1 class="text-2xl font-black text-white mb-3">機台 B 後台登入</h1>
            <p class="text-slate-400 text-base mb-6">請輸入管理密碼。</p>
            <label for="admin-password" class="block text-base font-bold mb-2">密碼</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required maxlength="256" class="w-full rounded-lg border border-slate-600 bg-slate-950 text-white text-lg p-3 focus:outline-cyan-400" />
            <p id="login-error" role="alert" class="text-rose-300 text-sm min-h-6 my-3"></p>
            <button id="login-submit" type="submit" class="w-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold rounded-lg py-3 text-lg disabled:opacity-50">登入後台</button>
        </form>
    </section>

    <div id="admin-app" hidden>
    <input type="file" id="global-file-input-A" class="hidden" accept="image/*" />
    <input type="file" id="global-file-input-B" class="hidden" accept="image/*" />

    <header class="max-w-7xl mx-auto mb-8 flex flex-col sm:flex-row justify-between items-center border-b border-cyan-500/20 pb-4 gap-4">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
            <h1 class="text-2xl font-black tracking-wider text-white">機台 B 控制台 <span class="text-cyan-400 font-mono text-lg">[BOOTH_B]</span></h1>
        </div>
        
        <div class="flex flex-wrap items-center gap-3">
            <button type="button" onclick="logoutAdmin()" class="border border-slate-600 hover:bg-slate-800 font-bold px-4 py-2 rounded-lg text-sm">登出</button>
            <button onclick="fetchAllTasks()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow-[0_0_15px_rgba(0,242,255,0.3)]">
                <i class="fa-solid fa-arrows-rotate"></i> 重新整理
            </button>
            <button onclick="executeResetAll()" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 border border-rose-500/40">
                <i class="fa-solid fa-trash-can"></i> 重製機台 B 排隊
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <p id="storage-alert" role="alert" hidden class="mb-5 rounded-xl border border-amber-500 p-4 text-amber-200"></p>
        <p class="text-sm text-slate-400 mb-4">最新 50 筆訂單 · 客人確認後，按「下載列印圖」</p>
        <div id="tasks-container" class="grid grid-cols-1 gap-6 transition-all duration-500"></div>
    </main>
    </div>

    <script>
        // 🔒 硬編碼固定連線至機台 B 後端
        const API_BASE_URL = "https://aicamera-backend-b.onrender.com";
        let localTasksCache = {};
        let currentUploadTaskId = null;

        // Only a short-lived session token lives in this page's memory.
        // Reloading, leaving the page or signing out requires another login.
        let authToken = null;
        let authController = null;
        let refreshTimer = null;
        let expiryTimer = null;

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }

        function showLogin(message = '') {
            authToken = null;
            if (authController) authController.abort();
            authController = null;
            clearInterval(refreshTimer);
            clearTimeout(expiryTimer);
            refreshTimer = null;
            expiryTimer = null;
            localTasksCache = {};
            currentUploadTaskId = null;
            document.getElementById('tasks-container').replaceChildren();
            delete document.getElementById('tasks-container').dataset.renderedMarkup;
            document.getElementById('storage-alert').hidden = true;
            document.getElementById('storage-alert').textContent = '';
            document.getElementById('admin-app').hidden = true;
            document.getElementById('login-panel').hidden = false;
            document.getElementById('login-error').textContent = message;
            document.getElementById('admin-password').value = '';
            ['A', 'B'].forEach(side => { document.getElementById(`global-file-input-${side}`).value = ''; });
        }

        async function adminFetch(url, options = {}) {
            const token = authToken;
            if (!token || !authController) throw new Error('請先登入後台。');
            const headers = new Headers(options.headers);
            headers.set('Authorization', `Bearer ${token}`);
            const response = await fetch(url, { ...options, headers, credentials: 'omit', cache: 'no-store', signal: authController.signal });
            if (token !== authToken) throw new Error('登入狀態已變更。');
            if (response.status === 401) {
                showLogin('登入已逾時，請重新輸入密碼。');
                throw new Error('請重新登入後台。');
            }
            // Discard delayed responses from a previous login, even if their
            // response headers arrived just before logout.
            return {
                ok: response.ok,
                status: response.status,
                async json() {
                    const data = await response.json();
                    if (token !== authToken) throw new Error('登入狀態已變更。');
                    return data;
                },
                async blob() {
                    const data = await response.blob();
                    if (token !== authToken) throw new Error('登入狀態已變更。');
                    return data;
                }
            };
        }

        document.getElementById('login-form').addEventListener('submit', async event => {
            event.preventDefault();
            const input = document.getElementById('admin-password');
            const button = document.getElementById('login-submit');
            if (button.disabled) return;
            button.disabled = true;
            button.textContent = '登入中…';
            document.getElementById('login-error').textContent = '';
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/login`, {
                    method: 'POST', credentials: 'omit', cache: 'no-store',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: input.value })
                });
                input.value = '';
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.error || '登入失敗，請稍後再試。');
                if (!/^[A-Za-z0-9_-]{43}$/.test(data.token) || !Number.isFinite(data.expiresAt) || data.expiresAt <= Date.now()) {
                    throw new Error('登入驗證未完成，請重新登入。');
                }
                authToken = data.token;
                authController = new AbortController();
                document.getElementById('login-panel').hidden = true;
                document.getElementById('admin-app').hidden = false;
                expiryTimer = setTimeout(() => showLogin('登入已逾時，請重新輸入密碼。'), Math.min(data.expiresAt - Date.now(), 12 * 60 * 60 * 1000));
                refreshTimer = setInterval(fetchAllTasks, 5000);
                await fetchAllTasks();
            } catch (error) {
                showLogin(error instanceof TypeError ? '暫時無法連線，請稍後再試。' : error.message);
            } finally {
                input.value = '';
                button.disabled = false;
                button.textContent = '登入後台';
            }
        });

        async function logoutAdmin() {
            const token = authToken;
            showLogin('已登出。');
            if (token) {
                try {
                    await fetch(`${API_BASE_URL}/api/admin/logout`, {
                        method: 'POST', credentials: 'omit', cache: 'no-store',
                        headers: { Authorization: `Bearer ${token}` }
                    });
                } catch (_) { /* The page has already cleared its session and data. */ }
            }
        }

        window.addEventListener('pagehide', () => showLogin());
        window.addEventListener('pageshow', event => { if (event.persisted) showLogin(); });

        function compressAndResizeImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    const max_size = 1024; 
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/png'));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function executeResetAll() {
            if (!confirm("確定要重製機台 B 的所有排隊嗎？")) return;
            try {
                const res = await adminFetch(`${API_BASE_URL}/api/admin/reset-all`, { method: 'POST' });
                if ((await res.json()).success) { localTasksCache = {}; renderTasks([]); }
            } catch (err) {}
        }

        async function updateTaskMeta(taskId, field, value) {
            const task = localTasksCache[taskId];
            if (task) {
                task[field] = value;
                try {
                    const response = await adminFetch(`${API_BASE_URL}/api/admin/update-meta/${taskId}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ processStatus: task.processStatus, remark: task.remark })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.success) throw new Error(data.error || '備註保存失敗');
                } catch (error) { alert(error.message); }
            }
        }

        async function reprocessTask(taskId) {
            const button=document.getElementById(`reprocess-${taskId}`);
            if(button){button.disabled=true;button.textContent='重新處理中…';}
            try {
                const response=await adminFetch(`${API_BASE_URL}/api/admin/reprocess/${taskId}`,{method:'POST'});
                const data=await response.json();
                if(!response.ok || !data.success)throw new Error(data.error || '處理失敗');
                // Invalidate locally cached images so regenerated PNGs replace older previews.
                delete localTasksCache[taskId].resultImageA;delete localTasksCache[taskId].resultImageB;
                await fetchAllTasks();
            }catch(error){alert(error.message);}
            finally{if(button){button.disabled=false;button.textContent='重新處理原圖（不重新產圖）';}}
        }

        async function approveResult(taskId,choice) {
            if(!confirm('請確認透明背景、人物與 IP 完整、沒有粉紅色邊，再提供賓客預覽。'))return;
            try {
                const response=await adminFetch(`${API_BASE_URL}/api/admin/approve-result/${taskId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choice,confirmed:true})});
                const data=await response.json();if(!response.ok||!data.success)throw Error(data.error||'確認失敗');
                await fetchAllTasks();
            }catch(error){alert(error.message);}
        }

        function downloadSourceImage(taskId) {
            const task = localTasksCache[taskId]; if (!task || !task.sourceImage) return;
            const link = document.createElement('a'); link.href = task.sourceImage; link.download = `客照_B_#${taskId}.jpg`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        async function downloadResultImage(taskId, choice) {
            const task = localTasksCache[taskId]; if (!task) return;
            try {
                const response = await adminFetch(`${API_BASE_URL}/api/admin/download/${taskId}/${choice}`);
                if (!response.ok) throw new Error((await response.json()).error || '下載失敗');
                const blob = await response.blob();
                if (!['image/png', 'image/jpeg', 'image/webp'].includes(blob.type)) throw new Error('下載檔案格式不正確');
                const url = URL.createObjectURL(blob), link = document.createElement('a');
                link.href = url; link.download = `AI結果_B_#${taskId}.${blob.type === 'image/png' ? 'png' : blob.type === 'image/webp' ? 'webp' : 'jpg'}`;
                document.body.appendChild(link); link.click(); link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 30000);
            } catch (error) { alert(error.message); }
        }

        async function retrySave(taskId) {
            const button = document.getElementById(`save-${taskId}`);
            if (button) { button.disabled = true; button.textContent = '保存中…'; }
            try {
                const response = await adminFetch(`${API_BASE_URL}/api/admin/retry-save/${taskId}`, { method: 'POST' });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.error || '保存失敗');
                await fetchAllTasks();
            } catch (error) { alert(error.message); }
            finally { if (button) { button.disabled = false; button.textContent = '重新保存（不重新產圖）'; } }
        }

        function triggerDualUpload(taskId, targetType) {
            currentUploadTaskId = taskId; document.getElementById(`global-file-input-${targetType}`).click();
        }

        async function handleImageFileInject(file, taskId, type) {
            const uploadToken = authToken;
            compressAndResizeImage(file, async (compressedBase64) => {
                if (!authToken || authToken !== uploadToken) return;
                const bodyData = {}; bodyData[`resultImage${type}`] = compressedBase64;
                try {
                    const res = await adminFetch(`${API_BASE_URL}/api/admin/upload-result-dual/${taskId}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyData)
                    });
                    const data=await res.json();
                    if(!res.ok || !data.success)throw Error(data.error||'上傳失敗');
                    if(localTasksCache[taskId])delete localTasksCache[taskId][`resultImage${type}`];
                    await fetchAllTasks();
                } catch (err) { alert(err.message);fetchAllTasks(); }
            });
        }

        ['A', 'B'].forEach(type => {
            document.getElementById(`global-file-input-${type}`).addEventListener('change', function() {
                const taskId = currentUploadTaskId; if (!taskId || !this.files[0]) return;
                handleImageFileInject(this.files[0], taskId, type); this.value = "";
            });
        });

        const sourceRequests = new Set();
        async function fetchSourceImageIncrementally(taskId) {
            if (sourceRequests.has(taskId)) return;
            sourceRequests.add(taskId);
            try {
                const res = await adminFetch(`${API_BASE_URL}/api/admin/task-source-image/${taskId}`);
                const data = await res.json();
                if (data.success && data.sourceImage && localTasksCache[taskId]) {
                    localTasksCache[taskId].sourceImage = data.sourceImage;
                    renderTasks(Object.values(localTasksCache).sort((a, b) => b.id.localeCompare(a.id)));
                }
            } catch (e) { alert('原照讀取失敗，請再點一次重試。'); }
            finally { sourceRequests.delete(taskId); }
        }

        async function fetchResultImageIncrementally(taskId) {
            try {
                const res = await adminFetch(`${API_BASE_URL}/api/admin/task-result-images/${taskId}`);
                const data = await res.json();
                if (data.success && localTasksCache[taskId]) {
                    if (data.resultImageA) localTasksCache[taskId].resultImageA = data.resultImageA;
                    if (data.resultImageB) localTasksCache[taskId].resultImageB = data.resultImageB;
                    renderTasks(Object.values(localTasksCache).sort((a, b) => b.id.localeCompare(a.id)));
                }
            } catch (e) {}
        }

        let listRequestBusy = false;
        async function fetchAllTasks() {
            if (!authToken || document.hidden || listRequestBusy) return;
            listRequestBusy = true;
            try {
                const res = await adminFetch(`${API_BASE_URL}/api/admin/all-tasks?lightweight=true&limit=50`);
                const data = await res.json();
                const storageAlert = document.getElementById('storage-alert');
                storageAlert.hidden = res.ok && data.storageConfigured !== false;
                storageAlert.textContent = !res.ok ? (data.error || '訂單讀取失敗') : (data.storageError || '圖片儲存尚未設定，請先完成後端設定。');
                if (data.success) {
                    const recent = data.tasks.filter(t => /^\d{3,}$/.test(t.id)).sort((a,b)=>Number(b.id)-Number(a.id)).slice(0,50);
                    const visibleIds = new Set(recent.map(t=>t.id));
                    Object.keys(localTasksCache).forEach(id=>{if(!visibleIds.has(id))delete localTasksCache[id];});
                    recent.forEach(t => {
                        if (!['A', 'B'].includes(t.chosenDesign)) t.chosenDesign = null; 
                        const isNewTask = !localTasksCache[t.id];
                        if (isNewTask) { t.processStatus = t.processStatus || '製作中'; t.remark = t.remark || ''; } 
                        else {
                            t.processStatus = t.processStatus || localTasksCache[t.id].processStatus;
                            if (localTasksCache[t.id].sourceImage) t.sourceImage = localTasksCache[t.id].sourceImage;
                            ['A', 'B'].forEach(side => {
                                const key = `resultImage${side}`, previous = localTasksCache[t.id];
                                if (!t[key] && t[`hasResultImage${side}`] && previous[key]
                                    && t[key + 'File']?.sha256 === previous[key + 'File']?.sha256
                                    && t.cloudStatus === previous.cloudStatus) t[key] = previous[key];
                            });
                        }
                        localTasksCache[t.id] = t; 
                        // Original photos are loaded only when staff request them.
                        if ((t.hasResultImageA && !localTasksCache[t.id].resultImageA) || (t.hasResultImageB && !localTasksCache[t.id].resultImageB)) fetchResultImageIncrementally(t.id);
                    });
                    renderTasks(Object.values(localTasksCache).sort((a, b) => b.id.localeCompare(a.id)));
                }
            } catch (e) {}
            finally { listRequestBusy = false; }
        }

        function renderTasks(tasks) {
            if (!authToken) return;
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT')) return;
            const container = document.getElementById('tasks-container');
            if (tasks.length === 0) { container.innerHTML = `<div class="text-center py-12 text-slate-500 border border-dashed border-slate-800 rounded-2xl w-full">尚無排隊訂單</div>`; return; }


            const nextMarkup = tasks.slice().sort((a,b)=>Number(b.id)-Number(a.id)).slice(0,50).map(task => {
                const side = task.chosenDesign || (task.resultImageB ? 'B' : 'A');
                const image = task['resultImage'+side];
                const confirmed = !!task.chosenDesign;
                const currentStatus = task.processStatus || '製作中';
                const review = task['printStatus'+side] === 'review';
                const canDownload = confirmed && !!image;
                return `
                <div class="cyber-card p-5 rounded-2xl flex flex-col md:flex-row gap-6 items-center">
                    <div class="text-center md:w-32 flex-shrink-0">
                        <div class="text-4xl font-black text-white">#${task.id}</div>
                        <div class="text-xs text-slate-400 mt-2">${escapeHtml(task.createdAt || '')}</div>
                        <div class="text-xs text-cyan-300 mt-2">${escapeHtml(task.sceneName || '')}</div>
                    </div>
                    <div class="w-full md:w-52 flex-shrink-0">
                        ${image ? `<img loading="lazy" decoding="async" src="${escapeHtml(image)}" alt="合影預覽" class="w-full h-52 object-contain bg-white rounded-xl" />` : '<div class="h-32 flex items-center justify-center text-slate-400">圖片處理中</div>'}
                    </div>
                    <div class="w-full flex-1 min-w-0">
                        <p class="text-sm mb-3 ${confirmed?'text-emerald-300':'text-amber-300'}">${confirmed?'客人已確認':task.status==='failed'?'生成失敗':'等待客人確認'}</p>
                        <button ${canDownload ? `onclick="downloadResultImage('${task.id}','${side}')"` : 'disabled'} class="w-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 rounded-xl py-4 text-xl font-black disabled:opacity-40 disabled:cursor-not-allowed">下載列印圖</button>
                        ${review && image ? '<p class="text-xs text-slate-400 mt-2">列印前請看一下去背邊緣。</p>' : ''}
                        ${task.cloudStatus==='failed'?'<p class="text-sm text-amber-300 mt-2">雲端尚未保存，請開啟其他操作重試。</p>':''}
                        <div class="mt-4 flex items-center gap-3"><label class="text-sm text-slate-300">狀態</label>
                            <select onchange="updateTaskMeta('${task.id}', 'processStatus', this.value)" class="cyber-select flex-1">
                                ${['製作中','已完成','已取消'].map(s=>`<option ${currentStatus===s?'selected':''}>${s}</option>`).join('')}
                            </select>
                        </div>
                        <details data-task-id="${task.id}" class="mt-4 text-sm text-slate-300">
                            <summary class="cursor-pointer py-2">其他操作</summary>
                            <div class="flex flex-wrap gap-3 py-3">
                                ${task.sourceImage ? `<button onclick="downloadSourceImage('${task.id}')" class="underline">下載原照</button>` : `<button onclick="fetchSourceImageIncrementally('${task.id}')" class="underline">載入原照</button>`}
                                <button onclick="triggerDualUpload('${task.id}','${side}')" class="underline">補傳合影</button>
                                ${(task.originalGenerationUrlA || task.originalGenerationUrlB)?`<button id="reprocess-${task.id}" onclick="reprocessTask('${task.id}')" class="underline">重新處理原圖（不重新產圖）</button>`:''}
                                ${['failed','legacy'].includes(task.cloudStatus)?`<button id="save-${task.id}" onclick="retrySave('${task.id}')" class="underline">重新保存</button>`:''}
                            </div>
                            ${task.cloudError?`<p class="text-amber-300 mb-2">${escapeHtml(task.cloudError)}</p>`:''}
                            <label class="block mb-1">備註</label>
                            <textarea onchange="updateTaskMeta('${task.id}', 'remark', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2" rows="2">${escapeHtml(task.remark || '')}</textarea>
                        </details>
                    </div>
                </div>`;
            }).join('');
            if (container.dataset.renderedMarkup !== nextMarkup) {
                const openIds = new Set(Array.from(container.querySelectorAll('details[open]')).map(el => el.dataset.taskId));
                container.innerHTML = nextMarkup;
                container.querySelectorAll('details').forEach(el => { el.open = openIds.has(el.dataset.taskId); });
                container.dataset.renderedMarkup = nextMarkup;
            }
        }

        document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchAllTasks(); });
        showLogin();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Virtual Portrait | AI 虛擬肖像體驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+TC:wght@300;500;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 純前端 QR Code 生成函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <style>
        :root {
            --ai-cyan: #00f2ff;
            --ai-pink: #ff00d0;
            --ai-dark: #020617;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--ai-dark);
        }
        body {
            touch-action: pan-x pan-y;
            user-select: none; 
            -webkit-user-select: none;
            overflow-x: hidden; 
            font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
        }
        /* 🌟 向上偏移 45px 完美裁切移除背景圖頂部的黑色邊條 */
        .cyber-bg {
            background-image: url('https://img.shoplineapp.com/media/image_clips/6a4216a4c1e0e46c9bd9dde7/original.png?1782716067=&owner_id=66221c5c384dbb002ec45c18');
            background-size: cover;
            background-position: center -45px; 
            background-repeat: no-repeat;
            position: relative;
        }

        .kv-title {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(to bottom, #fff 30%, var(--ai-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.6));
        }
        .glow-bar {
            height: 4px;
            width: 320px;
            background: linear-gradient(90deg, transparent, var(--ai-pink), var(--ai-cyan), transparent);
            box-shadow: 0 0 16px var(--ai-pink), 0 0 28px var(--ai-cyan);
            border-radius: 50%;
        }
        .content-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            padding-top: 0.5rem;
        }
        @media (min-height: 1100px) and (max-aspect-ratio: 10/16) {
            .content-container { justify-content: flex-start; padding-top: 1.5rem; } 
        }
        .camera-container {
            width: 80vw; height: 80vw; max-width: 750px; max-height: 750px; 
            position: relative; overflow: hidden; border-radius: 2rem;
            border: 4px solid var(--ai-cyan);
            box-shadow: 0 0 45px rgba(0, 242, 255, 0.5);
            background-color: #000; transition: all 0.3s ease-in-out;
        }
        @media (min-height: 1100px) {
            .camera-container { max-width: 750px; max-height: 750px; }
        }
        .choice-card {
            border: 4px solid #1e293b;
            background: rgba(15, 23, 42, 0.7);
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }
        .choice-card.selected {
            border-color: var(--ai-cyan);
            box-shadow: 0 0 45px rgba(0, 242, 255, 0.6);
            background: rgba(0, 242, 255, 0.15);
            transform: scale(1.04);
        }
        .face-guide {
            width: 55%; aspect-ratio: 1 / 1.35; border-radius: 50%;
            border: 4px solid var(--ai-cyan);
            box-shadow: 0 0 25px var(--ai-cyan), 0 0 0 9999px rgba(2, 6, 23, 0.6);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }
        .radar-spinner {
            position: relative; width: 240px; height: 240px; 
            border-radius: 50%; border: 3px dashed rgba(0, 242, 255, 0.5);
            animation: spin 8s linear infinite;
        }
        .radar-spinner::before {
            content: ''; position: absolute; inset: 18px; border-radius: 50%;
            border: 6px solid transparent; border-top-color: var(--ai-cyan); border-bottom-color: var(--ai-cyan);
            animation: spin 2s linear infinite reverse;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .text-glow-pulse { animation: pulse-glow 2s ease-in-out infinite; }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; text-shadow: 0 0 25px var(--ai-cyan); } 50% { opacity: 0.6; text-shadow: 0 0 10px var(--ai-cyan); } }
        .btn-cyan {
            background: rgba(0, 242, 255, 0.1); border: 2.5px solid var(--ai-cyan); color: var(--ai-cyan);
            letter-spacing: 2px; transition: all 0.3s; box-shadow: 0 0 20px rgba(0, 242, 255, 0.25);
            position: relative;
            z-index: 10;
        }
        .btn-cyan:active:not(:disabled) { background: var(--ai-cyan); color: #000; box-shadow: 0 0 45px var(--ai-cyan); }
        .btn-red {
            background: rgba(255, 0, 208, 0.1); border: 2.5px solid var(--ai-pink); color: var(--ai-pink);
            letter-spacing: 2px; transition: all 0.3s;
            position: relative;
            z-index: 10;
        }
        .btn-red:active { background: var(--ai-pink); color: #000; }
        
        .lang-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(0, 242, 255, 0.3);
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background: var(--ai-cyan);
            color: #020617;
            border-color: var(--ai-cyan);
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.6);
        }
        .print-preview { background-color:#fff; background-image:conic-gradient(#eee 25%,#fff 0 50%,#eee 0 75%,#fff 0); background-size:20px 20px; }
    </style>
</head>
<body class="cyber-bg text-white min-h-[100dvh] w-screen flex flex-col">
    <div id="root" class="h-full w-full relative z-10 flex-grow flex flex-col"></div>

    <script src="assets/ip-catalog.js?v=8"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        // B 機專用後端。請勿改回 A 機服務。
        const API_BASE_URL = "https://aicamera-backend-b.onrender.com";
        const SCENES = (window.BOOTH_IPS || []).map(ip => ({...ip, guide: {
            zh: "請正面看鏡頭、自然微笑。我們會將您與選擇的夥伴一起畫進方舟，產生一張專屬合影。",
            jp: "正面を向いて笑ってください。選んだ仲間と一緒に方舟に乗る、一枚の記念イラストを描きます。",
            en: "Face the camera and smile. AI will draw you aboard the ark with your chosen buddy in one illustration."
        }}));

        // 多語系字典 (Traditional Chinese, English, Japanese)
        const TRANSLATIONS = {
            zh: {
                title: "AI 方舟互動拍貼",
                giftTitle: "選擇角色・一起航向數位未來",
                avatarLabel: "您的 AI 肖像",
                bagLabel: "與 IP 共乘方舟",
                startBtn: "開始體驗",
                startSub: "點擊下方按鈕開始體驗",
                homeBtn: "返回首頁",
                takePhotoBtn: "拍攝照片",
                cancelBtn: "取消返回首頁",
                cancelSub: "返回首頁",
                pickStyleTitle: "✨ 請確認您的合影 ✨",
                discardBtn: "放棄",
                confirmBtn: "確定",
                processing: "處理中...",
                submittedTitle: "合影已送出",
                submittedSub: "合影已送出",
                queueLabel: "您的專屬號碼",
                scanLabel: "掃碼下載頭像",
                scanGuide: "請用手機相機掃描 QR Code",
                autoReturn: "秒後自動返回",
                loadingTexts: ["正在準備您的互動合影", "參考您的外觀與角色造型", "描繪一起乘船的互動", "正在繪製專屬合影", "即將完成專屬合影"],
                loadingSubTexts: [
                    "系統載入中...",
                    "特徵萃取中...",
                    "線條演算中...",
                    "模型套用中...",
                    "風格生成中..."
                ]
            },
            jp: {
                title: "AI アバター肖像画",
                giftTitle: "特典引き換え",
                avatarLabel: "AI生成アバター",
                bagLabel: "現場トートバッグ印刷",
                startBtn: "體驗開始",
                startSub: "タップしてスタート",
                homeBtn: "トップへ",
                takePhotoBtn: "撮影する",
                cancelBtn: "キャンセル",
                cancelSub: "トップへ戻る",
                pickStyleTitle: "✨ 写真をご確認ください ✨",
                discardBtn: "やめる",
                confirmBtn: "確定する",
                processing: "処理中...",
                submittedTitle: "送信が完了しました",
                submittedSub: "選択が完了しました",
                queueLabel: "お客様の受付番号",
                scanLabel: "QRコードで保存",
                scanGuide: "スマホのカメラで読み取ってください",
                autoReturn: "秒後に自動で戻ります",
                loadingTexts: ["写真を準備しています", "あなたとキャラクターを確認中", "一緒に方舟に乗る場面を描いています", "記念イラストを作成中", "もうすぐ完成です"],
                loadingSubTexts: [
                    "処理中...",
                    "抽出中...",
                    "計算中...",
                    "適用中...",
                    "生成中..."
                ]
            },
            en: {
                title: "AI Virtual Portrait",
                giftTitle: "Exclusive Gift",
                avatarLabel: "AI Avatar",
                bagLabel: "Live Printing Bag",
                startBtn: "START EXPERIENCE",
                startSub: "CLICK HERE TO START",
                homeBtn: "HOME",
                takePhotoBtn: "TAKE PHOTO",
                cancelBtn: "CANCEL",
                cancelSub: "RETURN TO HOME",
                pickStyleTitle: "✨ Preview Your Photo ✨",
                discardBtn: "CANCEL",
                confirmBtn: "CONFIRM",
                processing: "Processing...",
                submittedTitle: "Photo Submitted",
                submittedSub: "Photo Submitted",
                queueLabel: "YOUR QUEUE NUMBER",
                scanLabel: "Scan to Download",
                scanGuide: "Use your Phone Camera to Scan",
                autoReturn: "s Auto-Return",
                loadingTexts: ["Preparing your photo", "Referencing you and the character", "Drawing your shared boat ride", "Creating your illustration", "Your picture is almost ready"],
                loadingSubTexts: [
                    "PLEASE WAIT...",
                    "PROCESSING...",
                    "ANALYZING...",
                    "APPLYING MODEL...",
                    "FINALIZING..."
                ]
            }
        };

        const App = () => {
            const [step, setStep] = useState('home');
            const [lang, setLang] = useState('zh'); // 🌟 預設語言改為繁體中文 'zh'
            const [taskId, setTaskId] = useState(null);
            const [needsReview, setNeedsReview] = useState(false);
            const [imgB, setImgB] = useState(null);
            
            const [cameraError, setCameraError] = useState(false);
            const [selectedSceneId, setSelectedSceneId] = useState(null);

            const t = TRANSLATIONS[lang];
            const selectedScene = SCENES.find(scene => scene.id === selectedSceneId) || SCENES[0];

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const qrCanvasRef = useRef(null);
            const [countdown, setCountdown] = useState(0);
            const [textIndex, setTextIndex] = useState(0);
            const pollingRef = useRef(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [stream, setStream] = useState(null);
            const [returnCountdown, setReturnCountdown] = useState(15);

            const startCamera = async () => {
                try {
                    setCameraError(false);
                    const mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    setStream(mediaStream);
                    setStep('camera');
                } catch (err) {
                    setCameraError(true);
                }
            };

            useEffect(() => {
                if (step === 'camera' && stream && videoRef.current) {
                    videoRef.current.srcObject = stream;
                    videoRef.current.play().catch(e => console.log("Play error:", e));
                }
            }, [step, stream]);

            const takePhoto = () => {
                if (countdown > 0) return;
                setCountdown(3);
                let count = 3;
                const timer = setInterval(() => {
                    count -= 1;
                    setCountdown(count);
                    if (count === 0) {
                        clearInterval(timer);
                        capture();
                    }
                }, 1000);
            };

            const capture = async () => {
                const video = videoRef.current;
                const canvas = canvasRef.current;
                if (!video || !canvas) return;
                const ctx = canvas.getContext('2d');
                const size = Math.min(video.videoWidth, video.videoHeight);
                
                canvas.width = size; canvas.height = size;
                ctx.translate(size, 0); ctx.scale(-1, 1);
                ctx.drawImage(video, (video.videoWidth - size) / 2, (video.videoHeight - size) / 2, size, size, 0, 0, size, size);
                
                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                if (stream) stream.getTracks().forEach(t => t.stop());
                setStream(null);
                setStep('loading');
                setImgB(null);
                setNeedsReview(false);

                try {
                    const res = await fetch(API_BASE_URL + "/api/upload", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: dataUrl, sceneId: selectedSceneId })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.error || '照片送出失敗');
                    setTaskId(data.taskId);
                } catch (err) {
                    console.error("照片送出失敗", err);
                    alert(`照片送出失敗：${err.message || '請確認網路與 B 機後端'}`);
                    setStep('home');
                }
            };

            const finalizeChoice = async () => {
                if (!imgB || needsReview) return;
                setIsSubmitting(true);
                
                try {
                    const response = await fetch(API_BASE_URL + "/api/choice/" + taskId, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ choice: 'B' })
                    });
                    const data=await response.json();
                    if(!response.ok || !data.success)throw new Error(data.error || '送出失敗');
                } catch(e) { 
                    console.error("回傳選擇失敗", e);
                    alert(e.message || "送出失敗，請重試");
                    setIsSubmitting(false);
                    return; 
                }

                setIsSubmitting(false);
                setReturnCountdown(15);
                setStep('completed');
            };

            const handleCancelAndGoHome = () => {
                if (pollingRef.current) clearInterval(pollingRef.current);
                if (stream) stream.getTracks().forEach(t => t.stop());
                setStream(null);
                setTaskId(null);
                setImgB(null);
                setNeedsReview(false);
                setCameraError(false);
                setStep('home');
            };

            useEffect(() => {
                if (step === 'completed' && taskId && qrCanvasRef.current) {
                    const basePath = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
                    const downloadUrl = `${basePath}download.html?taskId=${taskId}&lang=${lang}`;
                    
                    new QRious({
                        element: qrCanvasRef.current,
                        value: downloadUrl,
                        size: 200,
                        background: '#ffffff',
                        foreground: '#020617',
                        level: 'H'
                    });
                }
            }, [step, taskId, lang]);

            useEffect(() => {
                let returnTimer;
                if (step === 'completed' && returnCountdown > 0) {
                    returnTimer = setTimeout(() => {
                        setReturnCountdown(prev => prev - 1);
                    }, 1000);
                } else if (step === 'completed' && returnCountdown === 0) {
                    handleCancelAndGoHome();
                }
                return () => clearTimeout(returnTimer);
            }, [step, returnCountdown]);

            useEffect(() => {
                if (!['loading','choice'].includes(step) || !taskId) return;
                let active=true, busy=false;
                const textInterval=step==='loading' ? setInterval(() => setTextIndex(p => (p+1)%t.loadingTexts.length),1500) : null;
                const poll=async () => {
                    if(busy)return;busy=true;
                    try {
                        const response=await fetch(API_BASE_URL + '/api/status/' + taskId);
                        if(!response.ok)return;
                        const data=await response.json();
                        if(!active)return;
                        if(['completed','partial','failed'].includes(data.status)) {
                            const ready=data.printStatusB==='ready' && !!data.resultImageB;
                            setImgB(ready ? data.resultImageB : null);
                            setNeedsReview(!ready);
                            if(step==='loading')setStep('choice');
                        }
                    } catch(error){console.warn('暫時無法查詢合影，稍後重試');}
                    finally{busy=false;}
                };
                pollingRef.current=setInterval(poll,3000);
                poll();
                return () => {active=false;clearInterval(textInterval);clearInterval(pollingRef.current);};
            }, [step, taskId, lang]);

            return (
                <div className="flex flex-col items-center justify-between min-h-[100dvh] w-full pt-3 pb-8 px-6">
                    
                    {/* Header - 頂部霓虹線條與多國語言切換鈕 */}
                    <div className="text-center z-20 flex flex-col items-center flex-shrink-0 w-full pt-1 relative">
                        <div className="glow-bar mt-1"></div>
                        
                        {/* 🌐 多國語言切換 (切換繁中 / 日本語 / English) */}
                        <div className="absolute right-0 top-0 flex items-center gap-1.5 bg-slate-900/80 p-1 rounded-full border border-ai-cyan/30 shadow-lg backdrop-blur-md">
                            <button onClick={() => setLang('zh')} className={`lang-btn ${lang === 'zh' ? 'active' : ''}`}>繁中</button>
                            <button onClick={() => setLang('jp')} className={`lang-btn ${lang === 'jp' ? 'active' : ''}`}>日本語</button>
                            <button onClick={() => setLang('en')} className={`lang-btn ${lang === 'en' ? 'active' : ''}`}>EN</button>
                        </div>
                    </div>

                    {/* 互動內容控制中樞 */}
                    <div className="content-container z-10">
                        
                        {step === 'home' && (
                            <div className="text-center mt-2 sm:mt-6 flex flex-col items-center justify-start w-full">
                                <p className="text-ai-cyan text-xl sm:text-3xl md:text-4xl mb-3 tracking-[0.2em] text-glow-pulse font-bold">
                                    {t.title}
                                </p>
                                <p className="text-ai-pink text-xl sm:text-2xl md:text-3xl tracking-[0.2em] font-black mb-12 drop-shadow-[0_0_15px_rgba(255,0,208,0.8)]">
                                    <i className="fa-solid fa-gift mr-3 text-white/90"></i>{t.giftTitle}
                                </p>
                                
                                <div className="w-full max-w-[960px] mb-6 px-4">
                                    <p className="text-lg text-white mb-4">{{zh:"1. 選擇一起乘船的 IP 夥伴",jp:"1. 仲間を選んでください",en:"1. Choose your IP buddy"}[lang]}</p>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">
                                    {SCENES.map(scene => (
                                        <button type="button" key={scene.id} aria-label={scene.name[lang]} aria-pressed={selectedSceneId === scene.id} onClick={() => setSelectedSceneId(scene.id)} className={`choice-card w-full p-3 rounded-2xl text-center ${selectedSceneId === scene.id ? 'selected' : ''}`}>
                                            <img src={scene.preview} className="w-full h-28 sm:h-36 object-contain rounded-xl bg-white p-2" alt={scene.name[lang]} />
                                        </button>
                                    ))}
                                    </div>
                                </div>

                                <button onClick={startCamera} disabled={!selectedSceneId} className="disabled:opacity-40 disabled:cursor-not-allowed btn-cyan text-xl sm:text-3xl md:text-4xl font-black px-12 py-6 sm:py-8 rounded-full animate-pulse shadow-[0_0_35px_rgba(0,242,255,0.4)] flex flex-col items-center gap-1">
                                    <span>{{zh:"2. 拍照生成",jp:"2. 写真を撮る",en:"2. Take your photo"}[lang]}</span>
                                </button>
                            </div>
                        )}

                        {step === 'camera' && (
                            <div className="flex flex-col items-center w-full">
                                <div className="w-full max-w-[760px] mb-4 bg-slate-950/80 border border-ai-cyan/50 rounded-2xl px-5 py-4 text-center">
                                    <p className="text-ai-cyan font-black text-lg sm:text-2xl mb-1">{selectedScene.name[lang]}</p>
                                    <p className="text-white text-sm sm:text-lg">{selectedScene.guide[lang]}</p>
                                </div>
                                <div className="camera-container">
                                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover absolute inset-0" style={{ transform: 'rotateY(180deg)' }} />
                                    <div className="face-guide"></div>
                                    {countdown > 0 && (
                                        <div className="absolute top-6 right-6 w-24 h-24 rounded-2xl border-2 border-ai-cyan bg-[#020617]/95 flex flex-col items-center justify-center shadow-[0_0_20px_rgba(0,242,255,0.4)]">
                                            <span className="text-[44px] font-black text-white font-mono">{countdown}</span>
                                        </div>
                                    )}
                                </div>
                                <div className="mt-8 flex gap-6 w-[85vw] sm:w-[80vw] max-w-[500px] sm:max-w-[750px] px-2">
                                    <button onClick={handleCancelAndGoHome} className="btn-cyan flex-1 py-4 sm:py-5 rounded-2xl text-base sm:text-xl font-bold flex flex-col items-center justify-center leading-tight">
                                        <span>{t.homeBtn}</span>
                                    </button>
                                    <button onClick={takePhoto} className="btn-cyan flex-[2.5] py-4 sm:py-5 rounded-2xl text-xl sm:text-3xl font-black bg-ai-cyan/20 shadow-[0_0_20px_rgba(0,242,255,0.3)] flex flex-col items-center justify-center leading-tight">
                                        <span>{t.takePhotoBtn}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 'loading' && (
                            <div className="flex flex-col items-center justify-center">
                                <div className="relative flex items-center justify-center mb-8">
                                    <div className="radar-spinner"></div>
                                </div>
                                <div className="h-32 text-center mb-6">
                                    <h2 className="text-2xl sm:text-4xl font-bold text-white tracking-wider mb-2 text-glow-pulse">{t.loadingTexts[textIndex]}</h2>
                                </div>
                                {taskId && (
                                    <div className="bg-black/40 p-5 sm:p-6 rounded-3xl border-2 border-ai-cyan text-center w-72 shadow-[0_0_30px_rgba(0,242,255,0.2)] mb-6">
                                        <p className="text-[10px] sm:text-[12px] text-slate-400 font-mono tracking-wider">PROGRESS ID</p>
                                        <p className="text-4xl sm:text-5xl font-mono font-black text-ai-cyan">#{taskId}</p>
                                    </div>
                                )}
                                <button onClick={handleCancelAndGoHome} className="btn-red px-8 py-3.5 rounded-2xl text-xs sm:text-base font-bold flex flex-col items-center justify-center">
                                    <span>{t.cancelBtn}</span>
                                </button>
                            </div>
                        )}

                        {step === 'choice' && (
                            <div className="flex flex-col items-center w-full max-w-[1000px] px-4">
                                <div className="text-center mb-6">
                                    <p className="text-ai-cyan text-lg sm:text-2xl font-bold tracking-widest animate-pulse">{t.pickStyleTitle}</p>
                                </div>
                                <div className="w-full max-w-[760px] mb-8 p-3 rounded-3xl border-2 border-cyan-400 bg-slate-900/70">
                                    {imgB && !needsReview ? <img src={imgB} className="w-full aspect-[4/3] object-contain print-preview rounded-2xl" alt={t.avatarLabel} /> :
                                    <div role="status" className="w-full aspect-[4/3] flex flex-col items-center justify-center gap-4 text-center p-6">
                                        <p className="text-xl font-bold">{{zh:'合影需要工作人員協助確認',jp:'スタッフが写真を確認しています',en:'Staff are checking your photo'}[lang]}</p>
                                        <p className="text-4xl font-mono">#{taskId}</p>
                                        <p className="text-slate-300">{{zh:'請告知工作人員您的號碼，無需重新拍照',jp:'この番号をスタッフにお伝えください。再撮影は不要です',en:'Show this number to staff. No new photo is needed.'}[lang]}</p>
                                    </div>}
                                </div>
                                <div className="flex gap-6 w-full sm:max-w-[700px]">
                                    <button onClick={handleCancelAndGoHome} className="btn-cyan flex-1 py-4 rounded-2xl text-xs sm:text-xl font-bold flex flex-col items-center justify-center">
                                        <span>{t.discardBtn}</span>
                                    </button>
                                    <button 
                                        disabled={!imgB || needsReview || isSubmitting} 
                                        onClick={finalizeChoice} 
                                        className={`flex-[2.5] py-4 rounded-2xl text-base sm:text-2xl font-black transition-all duration-300 flex flex-col items-center justify-center ${
                                            imgB && !needsReview 
                                                ? 'btn-cyan bg-cyan-400 text-slate-950 shadow-[0_0_35px_rgba(0,242,255,0.5)]' 
                                                : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                        }`}
                                    >
                                        <span><i className="fa-solid fa-check mr-2"></i>{isSubmitting ? t.processing : t.confirmBtn}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 'completed' && (
                            <div className="flex flex-col items-center w-full max-w-[850px] px-4 text-center">
                                <h2 className="text-3xl sm:text-5xl font-black text-ai-cyan tracking-widest mb-6 animate-pulse">{t.submittedTitle}</h2>
                                
                                <div className="bg-[#0f172a]/85 border-2 border-ai-cyan p-6 sm:p-8 rounded-[2.5rem] w-full mb-6 shadow-[0_0_45px_rgba(0,242,255,0.3)] flex flex-col md:flex-row items-center justify-center gap-8 md:gap-12">
                                    
                                    <div className="flex flex-col items-center">
                                        <img src={imgB} className="w-56 sm:w-72 aspect-[4/3] object-contain rounded-3xl mb-4 border-2 border-slate-700 shadow-lg" alt="Selected Style" />
                                        <p className="text-xs sm:text-sm text-slate-400 tracking-[0.2em] font-bold">{t.queueLabel}</p>
                                        <p className="text-5xl sm:text-7xl font-black text-white font-mono drop-shadow-[0_0_20px_#00f2ff]">#{taskId}</p>
                                    </div>

                                    <div className="flex flex-col items-center bg-slate-900/60 p-5 rounded-3xl border border-slate-700 w-full max-w-[280px]">
                                        <div className="p-3 bg-white rounded-2xl shadow-[0_0_20px_rgba(255,255,255,0.15)] flex items-center justify-center mb-3">
                                            <canvas ref={qrCanvasRef} className="w-40 h-40 object-contain"></canvas>
                                        </div>
                                        <span className="text-ai-cyan text-sm sm:text-base font-black tracking-widest mb-1">
                                            <i className="fa-solid fa-mobile-screen-button mr-1.5 animate-bounce"></i> {t.scanLabel}
                                        </span>
                                        <span className="text-[10px] sm:text-[11px] text-slate-400">{t.scanGuide}</span>
                                    </div>

                                </div>

                                <div className="flex items-center justify-center gap-3 text-ai-cyan text-sm sm:text-xl font-bold tracking-widest bg-ai-cyan/10 px-6 py-3.5 rounded-full border border-ai-cyan/30 shadow-inner max-w-md mx-auto">
                                    <i className="fa-solid fa-spinner animate-spin text-lg sm:text-xl"></i>
                                    <span>{returnCountdown} {t.autoReturn}</span>
                                </div>
                            </div>
                        )}

                    </div>

                    {cameraError && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border-2 border-rose-500 rounded-3xl p-8 max-w-md w-full text-center shadow-[0_0_45px_rgba(239,68,68,0.5)]">
                                <div className="w-20 h-20 rounded-full bg-rose-500/10 border-2 border-rose-500 flex items-center justify-center mx-auto mb-6 text-rose-500 text-4xl animate-bounce">
                                    <i className="fa-solid fa-camera"></i>
                                </div>
                                <h3 className="text-2xl font-black text-white mb-2">請開通相機權限</h3>
                                <p className="text-slate-400 text-sm leading-relaxed mb-6">
                                    機台偵測不到視訊鏡頭。請點擊瀏覽器網址列旁的「鎖頭」圖示，並將相機存取權限設為「允許」。<br/>
                                    <span className="text-xs font-mono text-rose-400 block mt-2">Please enable camera permissions in browser settings.</span>
                                </p>
                                <button onClick={() => setCameraError(false)} className="btn-cyan w-full py-4 rounded-2xl font-black text-lg">
                                    確認 / CONFIRM
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 🌟 Footer 合作單位 LOGO 區塊 */}
                    <div className="w-full flex flex-col items-center justify-center gap-2 pt-2 z-10">
                        <div className="flex items-center justify-center bg-white/95 px-5 py-2 rounded-2xl shadow-[0_0_20px_rgba(255,255,255,0.3)] backdrop-blur-md">
                            <img src="https://img.shoplineapp.com/media/image_clips/6a70274247e08ca4d6740eca/original.png?1785734978=&owner_id=66221c5c384dbb002ec45c18" alt="合作單位 LOGO" className="h-6 sm:h-8 object-contain" />
                        </div>
                        <div 
                            onClick={handleCancelAndGoHome}
                            className="w-full text-center opacity-40 text-xs sm:text-sm font-mono text-ai-cyan tracking-widest cursor-default select-none active:text-white transition-colors duration-150"
                            title="工作人員專用跳轉 / Staff Reset"
                        >
                            2026
                        </div>
                    </div>
                    <canvas ref={canvasRef} className="hidden"></canvas>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

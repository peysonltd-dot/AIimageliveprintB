<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 方舟互動拍貼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+TC:wght@300;500;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 純前端 QR Code 生成函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <link rel="stylesheet" href="assets/ocean-theme.css?v=14">
</head>
<body class="ocean-bg text-sky-950 min-h-[100dvh] w-screen flex flex-col">
    <div id="root" class="h-full w-full relative z-10 flex-grow flex flex-col"></div>

    <script src="assets/ip-catalog.js?v=11"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        // B 機專用後端。請勿改回 A 機服務。
        const API_BASE_URL = "https://aicamera-backend-b.onrender.com";
        const SCENES = (window.BOOTH_IPS || []).map(ip => ({...ip, guide: {
            zh: "請正面看鏡頭、自然微笑。我們會將您與選擇的夥伴一起畫進方舟，產生一張專屬合影。",
            jp: "正面を向いて笑ってください。選んだ仲間と一緒に方舟に乗る、一枚の記念イラストを描きます。",
            en: "Face the camera and smile. AI will draw you aboard the ark with your chosen buddy in one illustration."
        }}));

        // 多語系字典 (Traditional Chinese, English, Japanese)
        const TRANSLATIONS = {
            zh: {
                title: "AI 方舟互動拍貼",
                giftTitle: "選擇角色・一起航向數位未來",
                avatarLabel: "您的 AI 肖像",
                bagLabel: "與 IP 共乘方舟",
                startBtn: "開始體驗",
                startSub: "點擊下方按鈕開始體驗",
                homeBtn: "返回首頁",
                takePhotoBtn: "拍攝照片",
                cancelBtn: "取消返回首頁",
                cancelSub: "返回首頁",
                pickStyleTitle: "✨ 請確認您的合影 ✨",
                discardBtn: "放棄",
                confirmBtn: "確定",
                processing: "處理中...",
                submittedTitle: "合影已送出",
                submittedSub: "合影已送出",
                queueLabel: "您的專屬號碼",
                scanLabel: "掃碼下載合影",
                scanGuide: "請用手機相機掃描 QR Code",
                autoReturn: "秒後自動返回",
                loadingTexts: ["正在準備您的互動合影", "參考您的外觀與角色造型", "描繪一起乘船的互動", "正在繪製專屬合影", "即將完成專屬合影"],
                loadingSubTexts: [
                    "系統載入中...",
                    "特徵萃取中...",
                    "線條演算中...",
                    "模型套用中...",
                    "風格生成中..."
                ]
            },
            jp: {
                title: "AI アバター肖像画",
                giftTitle: "特典引き換え",
                avatarLabel: "AI生成アバター",
                bagLabel: "現場トートバッグ印刷",
                startBtn: "體驗開始",
                startSub: "タップしてスタート",
                homeBtn: "トップへ",
                takePhotoBtn: "撮影する",
                cancelBtn: "キャンセル",
                cancelSub: "トップへ戻る",
                pickStyleTitle: "✨ 写真をご確認ください ✨",
                discardBtn: "やめる",
                confirmBtn: "確定する",
                processing: "処理中...",
                submittedTitle: "送信が完了しました",
                submittedSub: "選択が完了しました",
                queueLabel: "お客様の受付番号",
                scanLabel: "QRコードで保存",
                scanGuide: "スマホのカメラで読み取ってください",
                autoReturn: "秒後に自動で戻ります",
                loadingTexts: ["写真を準備しています", "あなたとキャラクターを確認中", "一緒に方舟に乗る場面を描いています", "記念イラストを作成中", "もうすぐ完成です"],
                loadingSubTexts: [
                    "処理中...",
                    "抽出中...",
                    "計算中...",
                    "適用中...",
                    "生成中..."
                ]
            },
            en: {
                title: "AI Virtual Portrait",
                giftTitle: "Exclusive Gift",
                avatarLabel: "AI Avatar",
                bagLabel: "Live Printing Bag",
                startBtn: "START EXPERIENCE",
                startSub: "CLICK HERE TO START",
                homeBtn: "HOME",
                takePhotoBtn: "TAKE PHOTO",
                cancelBtn: "CANCEL",
                cancelSub: "RETURN TO HOME",
                pickStyleTitle: "✨ Preview Your Photo ✨",
                discardBtn: "CANCEL",
                confirmBtn: "CONFIRM",
                processing: "Processing...",
                submittedTitle: "Photo Submitted",
                submittedSub: "Photo Submitted",
                queueLabel: "YOUR QUEUE NUMBER",
                scanLabel: "Scan to Download",
                scanGuide: "Use your Phone Camera to Scan",
                autoReturn: "s Auto-Return",
                loadingTexts: ["Preparing your photo", "Referencing you and the character", "Drawing your shared boat ride", "Creating your illustration", "Your picture is almost ready"],
                loadingSubTexts: [
                    "PLEASE WAIT...",
                    "PROCESSING...",
                    "ANALYZING...",
                    "APPLYING MODEL...",
                    "FINALIZING..."
                ]
            }
        };

        const OceanWait = ({preview}) => (
            <div className="ocean-voyage" aria-hidden="true">
                <div className="voyage-sun"></div><div className="voyage-cloud"></div>
                <div className="voyage-wave"><svg viewBox="0 0 1200 180" preserveAspectRatio="none"><path d="M0 45 Q75 5 150 45 T300 45 T450 45 T600 45 T750 45 T900 45 T1050 45 T1200 45 V180 H0Z" fill="#97d5e8" /></svg></div>
                <div className="voyage-boat"><img className="boat-ip" src={preview} alt="" /><img className="boat-hull" src="assets/boat.svg" alt="" /></div>
                <div className="voyage-wave front"><svg viewBox="0 0 1200 180" preserveAspectRatio="none"><path d="M0 40 Q75 0 150 40 T300 40 T450 40 T600 40 T750 40 T900 40 T1050 40 T1200 40 V180 H0Z" fill="#62bbd6" /><path d="M0 40 Q75 0 150 40 T300 40 T450 40 T600 40 T750 40 T900 40 T1050 40 T1200 40" stroke="#e9fbff" strokeWidth="5" fill="none" /></svg></div>
            </div>
        );

        const App = () => {
            const [step, setStep] = useState('home');
            const [progress, setProgress] = useState(0);
            useEffect(() => {
                if (step !== 'loading') return;
                setProgress(0);
                const started = Date.now();
                // Visual estimate only: the provider does not return a completion percentage.
                const timer = setInterval(() => setProgress(95 * (1 - Math.exp(-(Date.now() - started) / 60000))), 500);
                return () => clearInterval(timer);
            }, [step]);
            const [lang, setLang] = useState('zh'); // 🌟 預設語言改為繁體中文 'zh'
            const [taskId, setTaskId] = useState(null);
            const [imgB, setImgB] = useState(null);
            
            const [cameraError, setCameraError] = useState(false);
            const [selectedSceneId, setSelectedSceneId] = useState(null);

            const t = TRANSLATIONS[lang];
            const selectedScene = SCENES.find(scene => scene.id === selectedSceneId) || SCENES[0];

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const qrCanvasRef = useRef(null);
            const [countdown, setCountdown] = useState(0);
            const [textIndex, setTextIndex] = useState(0);
            const pollingRef = useRef(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [stream, setStream] = useState(null);
            const [returnCountdown, setReturnCountdown] = useState(15);

            const startCamera = async () => {
                try {
                    setCameraError(false);
                    const mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    setStream(mediaStream);
                    setStep('camera');
                } catch (err) {
                    setCameraError(true);
                }
            };

            useEffect(() => {
                if (step === 'camera' && stream && videoRef.current) {
                    videoRef.current.srcObject = stream;
                    videoRef.current.play().catch(e => console.log("Play error:", e));
                }
            }, [step, stream]);

            const takePhoto = () => {
                if (countdown > 0) return;
                setCountdown(3);
                let count = 3;
                const timer = setInterval(() => {
                    count -= 1;
                    setCountdown(count);
                    if (count === 0) {
                        clearInterval(timer);
                        capture();
                    }
                }, 1000);
            };

            const capture = async () => {
                const video = videoRef.current;
                const canvas = canvasRef.current;
                if (!video || !canvas) return;
                const ctx = canvas.getContext('2d');
                const size = Math.min(video.videoWidth, video.videoHeight);
                
                canvas.width = size; canvas.height = size;
                ctx.translate(size, 0); ctx.scale(-1, 1);
                ctx.drawImage(video, (video.videoWidth - size) / 2, (video.videoHeight - size) / 2, size, size, 0, 0, size, size);
                
                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                if (stream) stream.getTracks().forEach(t => t.stop());
                setStream(null);
                setStep('loading');
                setImgB(null);

                try {
                    const res = await fetch(API_BASE_URL + "/api/upload", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: dataUrl, sceneId: selectedSceneId })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.error || '照片送出失敗');
                    setTaskId(data.taskId);
                } catch (err) {
                    console.error("照片送出失敗", err);
                    alert(`照片送出失敗：${err.message || '請確認網路與 B 機後端'}`);
                    setStep('home');
                }
            };

            const finalizeChoice = async () => {
                if (!imgB) return;
                setIsSubmitting(true);
                
                try {
                    const response = await fetch(API_BASE_URL + "/api/choice/" + taskId, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ choice: 'B' })
                    });
                    const data=await response.json();
                    if(!response.ok || !data.success)throw new Error(data.error || '送出失敗');
                } catch(e) { 
                    console.error("回傳選擇失敗", e);
                    alert(e.message || "送出失敗，請重試");
                    setIsSubmitting(false);
                    return; 
                }

                setIsSubmitting(false);
                setReturnCountdown(15);
                setStep('completed');
            };

            const handleCancelAndGoHome = () => {
                if (pollingRef.current) clearInterval(pollingRef.current);
                if (stream) stream.getTracks().forEach(t => t.stop());
                setStream(null);
                setTaskId(null);
                setImgB(null);
                setCameraError(false);
                setStep('home');
            };

            useEffect(() => {
                if (step === 'completed' && taskId && qrCanvasRef.current) {
                    const basePath = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
                    const downloadUrl = `${basePath}download.html?taskId=${taskId}&lang=${lang}`;
                    
                    new QRious({
                        element: qrCanvasRef.current,
                        value: downloadUrl,
                        size: 200,
                        background: '#ffffff',
                        foreground: '#020617',
                        level: 'H'
                    });
                }
            }, [step, taskId, lang]);

            useEffect(() => {
                let returnTimer;
                if (step === 'completed' && returnCountdown > 0) {
                    returnTimer = setTimeout(() => {
                        setReturnCountdown(prev => prev - 1);
                    }, 1000);
                } else if (step === 'completed' && returnCountdown === 0) {
                    handleCancelAndGoHome();
                }
                return () => clearTimeout(returnTimer);
            }, [step, returnCountdown]);

            useEffect(() => {
                if (!['loading','choice'].includes(step) || !taskId) return;
                let active=true, busy=false;
                const textInterval=step==='loading' ? setInterval(() => setTextIndex(p => (p+1)%t.loadingTexts.length),1500) : null;
                const poll=async () => {
                    if(busy)return;busy=true;
                    try {
                        const response=await fetch(API_BASE_URL + '/api/status/' + taskId);
                        if(!response.ok)return;
                        const data=await response.json();
                        if(!active)return;
                        if(['completed','partial','failed'].includes(data.status)) {
                            // Print preparation warnings belong to the staff view, not guest preview availability.
                            setImgB(data.resultImageB || null);
                            if(step==='loading'){if(data.resultImageB)setProgress(100);setStep('choice');}
                        }
                    } catch(error){console.warn('暫時無法查詢合影，稍後重試');}
                    finally{busy=false;}
                };
                pollingRef.current=setInterval(poll,3000);
                poll();
                return () => {active=false;clearInterval(textInterval);clearInterval(pollingRef.current);};
            }, [step, taskId, lang]);

            return (
                <div className="ocean-shell flex flex-col items-center justify-between min-h-[100dvh] w-full pt-3 pb-8 px-6">
                    <div className="ocean-backdrop" aria-hidden="true"><svg viewBox="0 0 1440 260" preserveAspectRatio="none"><path d="M0 95 Q360 0 720 95 T1440 95 V260 H0Z" fill="#c5eaf5" /><path d="M0 170 Q360 85 720 170 T1440 170 V260 H0Z" fill="#a8dcec" /></svg></div>
                    
                    {/* Header - 頂部霓虹線條與多國語言切換鈕 */}
                    <div className="ocean-header text-center z-20 flex flex-col items-center flex-shrink-0 w-full pt-1 relative">
                        <div className="glow-bar mt-1"></div>
                        
                        {/* 🌐 多國語言切換 (切換繁中 / 日本語 / English) */}
                        <div className="lang-switch absolute right-0 top-0 flex items-center gap-1.5 p-1 rounded-full">
                            <button onClick={() => setLang('zh')} className={`lang-btn ${lang === 'zh' ? 'active' : ''}`}>繁中</button>
                            <button onClick={() => setLang('jp')} className={`lang-btn ${lang === 'jp' ? 'active' : ''}`}>日本語</button>
                            <button onClick={() => setLang('en')} className={`lang-btn ${lang === 'en' ? 'active' : ''}`}>EN</button>
                        </div>
                    </div>

                    {/* 互動內容控制中樞 */}
                    <div className="content-container z-10">
                        
                        {step === 'home' && (
                            <div className="text-center mt-2 sm:mt-6 flex flex-col items-center justify-start w-full">
                                <p className="ocean-home-title">
                                    {t.title}
                                </p>
                                <p className="ocean-home-subtitle">
                                    {t.giftTitle}
                                </p>
                                
                                <div className="w-full max-w-[960px] mb-6 px-4">
                                    <p className="text-lg text-sky-950 mb-4">{{zh:"1. 選擇一起乘船的 IP 夥伴",jp:"1. 仲間を選んでください",en:"1. Choose your IP buddy"}[lang]}</p>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">
                                    {SCENES.map(scene => (
                                        <button type="button" key={scene.id} aria-label={scene.name[lang]} aria-pressed={selectedSceneId === scene.id} onClick={() => setSelectedSceneId(scene.id)} className={`choice-card w-full p-3 rounded-2xl text-center ${selectedSceneId === scene.id ? 'selected' : ''}`}>
                                            <img src={scene.preview} className="w-full h-28 sm:h-36 object-contain rounded-xl bg-white p-2" alt={scene.name[lang]} />
                                        </button>
                                    ))}
                                    </div>
                                </div>

                                <button onClick={startCamera} disabled={!selectedSceneId} className="disabled:opacity-40 disabled:cursor-not-allowed btn-cyan text-xl sm:text-3xl md:text-4xl font-black px-12 py-4 sm:py-5 rounded-full   flex flex-col items-center gap-1">
                                    <span>{{zh:"2. 拍照生成",jp:"2. 写真を撮る",en:"2. Take your photo"}[lang]}</span>
                                </button>
                            </div>
                        )}

                        {step === 'camera' && (
                            <div className="flex flex-col items-center w-full">
                                <div className="w-full max-w-[760px] mb-4 ocean-surface border border-ai-cyan/50 rounded-2xl px-5 py-4 text-center">
                                    <p className="text-sky-950 text-sm sm:text-lg">{selectedScene.guide[lang]}</p>
                                </div>
                                <div className="camera-container">
                                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover absolute inset-0" style={{ transform: 'rotateY(180deg)' }} />
                                    <div className="face-guide"></div>
                                    {countdown > 0 && (
                                        <div className="absolute top-6 right-6 w-24 h-24 rounded-2xl border-2 border-ai-cyan camera-countdown flex flex-col items-center justify-center ">
                                            <span className="text-[44px] font-black text-sky-950 font-mono">{countdown}</span>
                                        </div>
                                    )}
                                </div>
                                <div className="mt-8 flex gap-6 w-[85vw] sm:w-[80vw] max-w-[500px] sm:max-w-[750px] px-2">
                                    <button onClick={handleCancelAndGoHome} className="btn-cyan btn-secondary flex-1 py-4 sm:py-5 rounded-2xl text-base sm:text-xl font-bold flex flex-col items-center justify-center leading-tight">
                                        <span>{t.homeBtn}</span>
                                    </button>
                                    <button onClick={takePhoto} className="btn-cyan flex-[2.5] py-4 sm:py-5 rounded-2xl text-xl sm:text-3xl font-black bg-ai-cyan/20  flex flex-col items-center justify-center leading-tight">
                                        <span>{t.takePhotoBtn}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 'loading' && (
                            <div className="loading-screen flex flex-col items-center justify-center">
                                <OceanWait preview={selectedScene.preview} />
                                <div className="loading-copy">
                                    <h2 className="text-2xl sm:text-4xl font-bold text-sky-950 tracking-wider mb-2 ">{t.loadingTexts[textIndex]}</h2>
                                    <div className="loading-dots" aria-hidden="true"><i></i><i></i><i></i></div>
                                    <div className="generation-progress" role="progressbar" aria-label={{zh:'合影生成進度（預估）',jp:'生成の進行状況（目安）',en:'Estimated generation progress'}[lang]} aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.floor(progress)}>
                                        <div className="generation-progress-fill" style={{width: `${progress}%`}} />
                                    </div>
                                    <p className="generation-progress-note">{{zh:'正在生成中，進度僅供參考，完成後將自動顯示合影',jp:'進行状況は目安です。完成すると画像が自動で表示されます',en:'Progress is estimated. Your photo will appear automatically when ready.'}[lang]}</p>
                                </div>
                                {taskId && (
                                    <div className="loading-number">
                                        <p className="text-[10px] sm:text-[12px] text-slate-500 font-mono tracking-wider">{t.queueLabel}</p>
                                        <p className="text-4xl sm:text-5xl font-mono font-black text-ai-cyan">#{taskId}</p>
                                    </div>
                                )}
                                <button onClick={handleCancelAndGoHome} className="btn-red px-8 py-3.5 rounded-2xl text-xs sm:text-base font-bold flex flex-col items-center justify-center">
                                    <span>{t.cancelBtn}</span>
                                </button>
                            </div>
                        )}

                        {step === 'choice' && (
                            <div className="flex flex-col items-center w-full max-w-[1000px] px-4">
                                <div className="text-center mb-6">
                                    <p className="text-ai-cyan text-lg sm:text-2xl font-bold tracking-widest ">{t.pickStyleTitle}</p>
                                </div>
                                <div className="w-full max-w-[760px] mb-8 p-3 rounded-3xl border-2 border-cyan-400 ocean-surface">
                                    {imgB ? <img src={imgB} className="w-full aspect-[4/3] object-contain print-preview rounded-2xl" alt={t.avatarLabel} /> :
                                    <div role="status" className="w-full aspect-[4/3] flex flex-col items-center justify-center gap-4 text-center p-6">
                                        <p className="text-xl font-bold">{{zh:'暫時未取得合影',jp:'画像をまだ取得できません',en:'Your photo is not available yet'}[lang]}</p>
                                        <p className="text-4xl font-mono">#{taskId}</p>
                                        <p className="text-slate-600">{{zh:'請告知工作人員您的號碼，協助查詢生成狀態',jp:'この番号をスタッフにお伝えください',en:'Show this number to staff to check the generation status.'}[lang]}</p>
                                    </div>}
                                </div>
                                <div className="flex gap-6 w-full sm:max-w-[700px]">
                                    <button onClick={handleCancelAndGoHome} className="btn-cyan btn-secondary flex-1 py-4 rounded-2xl text-xs sm:text-xl font-bold flex flex-col items-center justify-center">
                                        <span>{t.discardBtn}</span>
                                    </button>
                                    <button 
                                        disabled={!imgB || isSubmitting} 
                                        onClick={finalizeChoice} 
                                        className={`flex-[2.5] py-4 rounded-2xl text-base sm:text-2xl font-black transition-all duration-300 flex flex-col items-center justify-center ${
                                            imgB 
                                                ? 'btn-cyan ' 
                                                : 'bg-sky-100 text-slate-500 border border-sky-200 cursor-not-allowed'
                                        }`}
                                    >
                                        <span><i className="fa-solid fa-check mr-2"></i>{isSubmitting ? t.processing : t.confirmBtn}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 'completed' && (
                            <div className="flex flex-col items-center w-full max-w-[850px] px-4 text-center">
                                <h2 className="text-3xl sm:text-5xl font-black text-ai-cyan tracking-widest mb-6 ">{t.submittedTitle}</h2>
                                
                                <div className="ocean-surface border-2 border-ai-cyan p-6 sm:p-8 rounded-[2.5rem] w-full mb-6  flex flex-col md:flex-row items-center justify-center gap-8 md:gap-12">
                                    
                                    <div className="flex flex-col items-center">
                                        <img src={imgB} className="w-56 sm:w-72 aspect-[4/3] object-contain rounded-3xl mb-4 border-2 border-sky-200 shadow-lg" alt="Selected Style" />
                                        <p className="text-xs sm:text-sm text-slate-500 tracking-[0.2em] font-bold">{t.queueLabel}</p>
                                        <p className="text-5xl sm:text-7xl font-black text-sky-950 font-mono ">#{taskId}</p>
                                    </div>

                                    <div className="flex flex-col items-center ocean-surface p-5 rounded-3xl border border-sky-200 w-full max-w-[280px]">
                                        <div className="p-3 bg-white rounded-2xl  flex items-center justify-center mb-3">
                                            <canvas ref={qrCanvasRef} className="w-40 h-40 object-contain"></canvas>
                                        </div>
                                        <span className="text-ai-cyan text-sm sm:text-base font-black tracking-widest mb-1">
                                            <i className="fa-solid fa-mobile-screen-button mr-1.5 animate-bounce"></i> {t.scanLabel}
                                        </span>
                                        <span className="text-[10px] sm:text-[11px] text-slate-500">{t.scanGuide}</span>
                                    </div>

                                </div>

                                <div className="flex items-center justify-center gap-3 text-ai-cyan text-sm sm:text-xl font-bold tracking-widest bg-ai-cyan/10 px-6 py-3.5 rounded-full border border-ai-cyan/30 shadow-inner max-w-md mx-auto">
                                    <i className="fa-solid fa-spinner animate-spin text-lg sm:text-xl"></i>
                                    <span>{returnCountdown} {t.autoReturn}</span>
                                </div>
                            </div>
                        )}

                    </div>

                    {cameraError && (
                        <div className="fixed inset-0 bg-sky-950/30 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="ocean-surface border-2 border-rose-500 rounded-3xl p-8 max-w-md w-full text-center ">
                                <div className="w-20 h-20 rounded-full bg-rose-500/10 border-2 border-rose-500 flex items-center justify-center mx-auto mb-6 text-rose-500 text-4xl animate-bounce">
                                    <i className="fa-solid fa-camera"></i>
                                </div>
                                <h3 className="text-2xl font-black text-sky-950 mb-2">請開通相機權限</h3>
                                <p className="text-slate-500 text-sm leading-relaxed mb-6">
                                    機台偵測不到視訊鏡頭。請點擊瀏覽器網址列旁的「鎖頭」圖示，並將相機存取權限設為「允許」。<br/>
                                    <span className="text-xs font-mono text-rose-400 block mt-2">Please enable camera permissions in browser settings.</span>
                                </p>
                                <button onClick={() => setCameraError(false)} className="btn-cyan w-full py-4 rounded-2xl font-black text-lg">
                                    確認 / CONFIRM
                                </button>
                            </div>
                        </div>
                    )}

                    <canvas ref={canvasRef} className="hidden"></canvas>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
